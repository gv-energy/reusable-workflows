name: Test

on:
  workflow_call:
    inputs:
      USE_DOTNET_7:
        required: false
        default: false
        type: boolean
      DOTNET_VERSIONS:
        description: 'Newline-separated SDK versions to install. When set, replaces the legacy 6/7/8/9 install steps.'
        required: false
        default: ''
        type: string
    secrets:
      PRIVATE_NUGET_USERNAME:
        required: true
      PRIVATE_NUGET_PAT:
        required: true

jobs:
  testing:
    runs-on: ubuntu-latest
    env:
      PRIVATE_NUGET_USERNAME: ${{ secrets.PRIVATE_NUGET_USERNAME }}
      PRIVATE_NUGET_PAT: ${{ secrets.PRIVATE_NUGET_PAT }}
      USE_DOTNET_7: ${{ inputs.USE_DOTNET_7 }}
      DOTNET_VERSIONS: ${{ inputs.DOTNET_VERSIONS }}
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup .NET (explicit versions)
        if: ${{ env.DOTNET_VERSIONS != '' }}
        id: setup-dotnet
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: ${{ inputs.DOTNET_VERSIONS }}
      - name: Setup .NET 6.x
        if: ${{ env.DOTNET_VERSIONS == '' && env.USE_DOTNET_7 == 'false'  }}
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: "6.x"
      - name: Setup .NET 7.x
        if: ${{ env.DOTNET_VERSIONS == '' && env.USE_DOTNET_7 == 'true' }}
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: "7.x"
      - name: Setup .NET 8.x
        if: ${{ env.DOTNET_VERSIONS == '' }}
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: "8.x"
      - name: Setup .NET 9.x
        if: ${{ env.DOTNET_VERSIONS == '' }}
        id: setup-dotnet-9
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "9.x"
      - name: Pin the .NET SDK
        env:
          SDK_VERSION: ${{ steps.setup-dotnet.outputs.dotnet-version || steps.setup-dotnet-9.outputs.dotnet-version }}
        run: |
          dir="$PWD"
          while true; do
            if [ -f "$dir/global.json" ]; then
              echo "Keeping $dir/global.json"
              exit 0
            fi
            if [ "$dir" = "$GITHUB_WORKSPACE" ] || [ "$dir" = "/" ]; then
              break
            fi
            dir=$(dirname "$dir")
          done
          if [ -z "$SDK_VERSION" ]; then
            echo "::error::setup-dotnet reported no SDK version to pin"
            exit 1
          fi
          printf '{\n  "sdk": {\n    "version": "%s",\n    "rollForward": "latestFeature"\n  }\n}\n' "$SDK_VERSION" > global.json
          echo "Pinned the .NET SDK to $SDK_VERSION (rollForward latestFeature)"
          dotnet --version
      - uses: actions/cache@v4.2.0
        with:
          path: ~/.nuget/packages
          # Look to see if there is a cache hit for the corresponding requirements file
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget
      - name: Run unit tests
        run: dotnet test
