name: Build, test and publish

# Compiles the solution once on the runner, runs the tests against those binaries,
# publishes each component from the same build, and layers the published output into
# runtime images. Nothing is compiled twice.
#
# The images carry published output rather than building inside an SDK container. This
# is the same shape as the .NET SDK's own container support (dotnet publish
# /t:PublishContainer): https://learn.microsoft.com/dotnet/core/containers/overview
# It requires a framework-dependent, RID-agnostic publish - which is what the default
# 'dotnet publish' produces - so the output is portable IL and runs on any runtime image.

on:
  workflow_call:
    inputs:
      COMPONENTS:
        required: false
        description: 'Space-separated components to build. Each needs a matching bake target.'
        type: string
        default: 'Api Worker Migrator'
      CONTEXT:
        required: false
        description: 'Allows to overwrite the context of the docker build'
        type: string
        default: './src'
      DOTNET_VERSIONS:
        required: false
        description: 'Newline-separated SDK versions to install.'
        type: string
        default: '9.x'
    secrets:
      SERVICE_NAME:
        required: true
      PRIVATE_NUGET_USERNAME:
        required: true
      PRIVATE_NUGET_PAT:
        required: true
      ACR_SERVER:
        required: true
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true
      ACR_PROD_SERVER:
        required: true
      ACR_PROD_USERNAME:
        required: true
      ACR_PROD_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PRIVATE_NUGET_USERNAME: ${{ secrets.PRIVATE_NUGET_USERNAME }}
      PRIVATE_NUGET_PAT: ${{ secrets.PRIVATE_NUGET_PAT }}
    defaults:
      run:
        working-directory: ${{ inputs.CONTEXT }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: ${{ inputs.DOTNET_VERSIONS }}

      - uses: actions/cache@v4.2.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run unit tests
        run: dotnet test -c Release --no-build

      - name: Publish every component from that build
        env:
          COMPONENTS: ${{ inputs.COMPONENTS }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
        run: |
          set -euo pipefail
          for component in $COMPONENTS; do
            dotnet publish "${SERVICE_NAME}.${component}/${SERVICE_NAME}.${component}.csproj" \
              -c Release --no-build -o "out/${component}"
          done

      - name: Login to ACR Non prod
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ secrets.ACR_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to ACR prod
        if: startsWith(github.ref, 'refs/tags') && github.event_name == 'push'
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ secrets.ACR_PROD_SERVER }}
          username: ${{ secrets.ACR_PROD_USERNAME }}
          password: ${{ secrets.ACR_PROD_PASSWORD }}

      - name: Set image prefix tag
        if: github.event_name == 'pull_request'
        run: echo TAG_PREFIX="$(echo ${GITHUB_HEAD_REF##*/,,} | sed -r 's/[/]+/_/g')" >> $GITHUB_ENV

      - name: Set image prefix tag
        if: startsWith(github.ref, 'refs/heads') && github.event_name == 'push'
        run: echo TAG_PREFIX="$(echo ${GITHUB_REF,,} | sed -e 's#refs/heads/##g' | sed -r 's/[/]+/_/g')" >> $GITHUB_ENV

      - name: Set image prefix tag
        if: startsWith(github.ref, 'refs/tags') && github.event_name == 'push'
        run: echo TAG_PREFIX="$(echo ${GITHUB_REF,,} | sed -e 's#refs/tags/##g')" >> $GITHUB_ENV

      - name: Set image tag
        if: startsWith(github.ref, 'refs/heads') && github.event_name == 'push'
        run: echo TAG="${TAG_PREFIX::100}"-$(date -d '${{ github.event.head_commit.timestamp }}' +'%s')-"${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set image tag
        if: github.event_name == 'pull_request'
        run: echo TAG="${TAG_PREFIX::100}"-$(date -d '${{ github.event.pull_request.updated_at }}' +'%s')-"${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set image tag
        if: startsWith(github.ref, 'refs/tags') && github.event_name == 'push'
        run: echo TAG="release-${TAG_PREFIX::100}" >> $GITHUB_ENV

      - name: Echo image tag
        run: echo ${{ env.TAG }}

      - name: Compose the tag list for every component
        env:
          COMPONENTS: ${{ inputs.COMPONENTS }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
          ACR_SERVER: ${{ secrets.ACR_SERVER }}
          ACR_PROD_SERVER: ${{ secrets.ACR_PROD_SERVER }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags') && github.event_name == 'push' }}
        run: |
          set -euo pipefail
          for component in $COMPONENTS; do
            image=$(echo "${SERVICE_NAME}.${component}" | tr '[:upper:]' '[:lower:]')
            key=$(echo "$component" | tr '[:lower:]' '[:upper:]')
            if [ "$IS_RELEASE" = "true" ]; then
              tags="${ACR_PROD_SERVER}/${image}:${TAG},${ACR_PROD_SERVER}/${image}:latest,${ACR_SERVER}/${image}:${TAG},${ACR_SERVER}/${image}:latest"
            else
              tags="${ACR_SERVER}/${image}:${TAG}"
            fi
            echo "TAGS_${key}=${tags}" >> "$GITHUB_ENV"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Bake and push
        env:
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
        run: docker buildx bake --push
